# Infra de dev locale : Postgres + Redis uniquement (l'API tourne via `dotnet run`).
# Ports décalés pour ne pas entrer en conflit avec d'autres projets locaux.
name: tontapp-dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tontinesapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:-devpass}
    ports:
      - "5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tontinesapp"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pg-data:
