name: CI

on:
  push:
    branches: [ '**' ]
    tags-ignore: [ '**' ]
  pull_request:
    branches: [ main, master ]

# One run per branch: a push and its pull request (same head branch) do not both run; a newer push cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore tontApp.slnx

      - name: Build
        run: dotnet build tontApp.slnx --configuration Release --no-restore

      # Inclut tests/ApiTests : Testcontainers démarre PostgreSQL et Redis sur le Docker du runner.
      - name: Test with Coverage
        run: |
          dotnet test tontApp.slnx \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate Coverage Report
        run: |
          reportgenerator \
            -reports:"./coverage/**/coverage.cobertura.xml" \
            -targetdir:"./coverage/report" \
            -reporttypes:"Html;Badges;TextSummary;Cobertura"

      - name: Display Coverage Summary
        run: cat ./coverage/report/Summary.txt

      - name: Check Domain Coverage Threshold
        run: python3 scripts/check-domain-coverage.py 70

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./coverage/report/

  # Web (dashboard) et mobile : typage, lint et tests unitaires, avec la version de Node de .nvmrc.
  front:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        projet: [ dashboard, mobile ]
    defaults:
      run:
        working-directory: ${{ matrix.projet }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.projet }}/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        if: matrix.projet == 'dashboard'
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

      # Mobile : la configuration Expo (plugins compris) se résout et le bundle JS se construit.
      - name: Expo config
        if: matrix.projet == 'mobile'
        env:
          CI: 1
        run: npx expo config --type prebuild > /dev/null

      - name: Bundle JS
        if: matrix.projet == 'mobile'
        env:
          CI: 1
          EXPO_PUBLIC_API_URL: http://localhost:5243
        run: |
          sortie="$RUNNER_TEMP/bundle"
          mkdir -p "$sortie/res"
          npx expo export:embed --platform android --dev false --entry-file index.ts \
            --bundle-output "$sortie/index.android.bundle" --assets-dest "$sortie/res"

  # APK Android debug : projet natif régénéré (prebuild --clean), bundle embarqué, APK en artefact.
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [ front ]
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Prebuild
        env:
          CI: 1
        run: npx expo prebuild --platform android --clean --no-install

      - name: Bundle JS
        env:
          CI: 1
          EXPO_PUBLIC_API_URL: http://localhost:5243
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export:embed --platform android --dev false --entry-file index.ts \
            --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res

      - name: Assemble debug APK
        working-directory: mobile/android
        run: ./gradlew app:assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ build-and-test, front ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Api/Dockerfile
          push: false
          tags: tontapp:ci

  # Exemple de job de déploiement (à adapter à ton infra : Azure Web App, container registry, etc.)
  # deploy:
  #   runs-on: ubuntu-latest
  #   needs: docker-build
  #   steps:
  #     - name: Deploy placeholder
  #       run: echo "Branch prête à être déployée (ajuster ce job selon votre cible)."

